name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate project
        run: bun run check

      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust lockfiles
        shell: pwsh
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file receivers/mirror-receiver/Cargo.lock

      - name: Validate release versions
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/validate-release-version.ps1
