name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Fetch AirPlay runtime
        shell: pwsh
        run: bun run fetch:airplay-runtime

      - name: Build installer assets
        shell: pwsh
        run: bun run release:installer

      - name: Build portable asset
        shell: pwsh
        run: bun run release:portable

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            release/portable/*.zip