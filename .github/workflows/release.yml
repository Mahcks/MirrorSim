name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mirrorsim-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag and source
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/validate-release-version.ps1 -ExpectedTag "${{ github.ref_name }}"
          bun run check

      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust lockfiles
        shell: pwsh
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file receivers/mirror-receiver/Cargo.lock

  build-windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build updater-signed release assets from pinned runtime
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY'
          }
          bun run release:all:fetch

      - name: Verify updater signatures against the embedded public key
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
            Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File
          )
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one NSIS installer and one MSI package, found $($artifacts.Count)."
          }
          $artifactPaths = @($artifacts | ForEach-Object FullName)
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_updater_signatures -- $artifactPaths
          if ($LASTEXITCODE -ne 0) {
            throw "Updater signature verification exited with code $LASTEXITCODE."
          }

      - name: Generate updater manifest and checksums
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-updater-manifest.ps1 -Repository $env:GITHUB_REPOSITORY -Tag "${{ github.ref_name }}"
          powershell -ExecutionPolicy Bypass -File scripts/write-release-checksums.ps1

      - name: Upload staged release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirrorsim-release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            release/portable/*.zip
            release/latest.json
            release/checksums.txt
            RELEASE_NOTES.md

  publish:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mirrorsim-release-${{ github.ref_name }}
          path: release-assets

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-assets/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/src-tauri/target/release/bundle/nsis/*.exe
            release-assets/src-tauri/target/release/bundle/nsis/*.exe.sig
            release-assets/src-tauri/target/release/bundle/msi/*.msi
            release-assets/src-tauri/target/release/bundle/msi/*.msi.sig
            release-assets/release/portable/*.zip
            release-assets/release/latest.json
            release-assets/release/checksums.txt
