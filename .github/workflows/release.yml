name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $version = $package.version
          if ("${{ github.ref_type }}" -eq "tag" -and -not [string]::IsNullOrWhiteSpace("${{ github.ref_name }}")) {
            $tag = "${{ github.ref_name }}"
          }
          else {
            $tag = "v$version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate updater signing config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY'
          }

      - name: Fetch AirPlay runtime
        shell: pwsh
        run: bun run fetch:airplay-runtime

      - name: Build installer assets
        shell: pwsh
        run: bun run release:installer:fetch

      - name: Build portable asset
        shell: pwsh
        run: bun run release:portable:fetch

      - name: Generate updater manifest
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-updater-manifest.ps1 -Repository $env:GITHUB_REPOSITORY -Tag "${{ steps.release_meta.outputs.tag }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            release/portable/*.zip
            release/latest.json
