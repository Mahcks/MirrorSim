name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $version = $package.version
          if ("${{ github.ref_type }}" -eq "tag" -and -not [string]::IsNullOrWhiteSpace("${{ github.ref_name }}")) {
            $tag = "${{ github.ref_name }}"
          }
          else {
            $tag = "v$version"
          }

          powershell -ExecutionPolicy Bypass -File scripts/validate-release-version.ps1 -ExpectedTag $tag

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        shell: pwsh
        run: |
          bun run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path receivers/mirror-receiver/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path receivers/mirror-receiver/Cargo.toml

      - name: Validate updater signing config
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY'
          }

      - name: Build release assets from pinned runtime
        shell: pwsh
        run: bun run release:all:fetch

      - name: Generate updater manifest
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-updater-manifest.ps1 -Repository $env:GITHUB_REPOSITORY -Tag "${{ steps.release_meta.outputs.tag }}"

      - name: Generate release checksums
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/write-release-checksums.ps1

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: MirrorSim ${{ steps.release_meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            release/portable/*.zip
            release/latest.json
            release/checksums.txt
